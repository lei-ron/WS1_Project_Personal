<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Testing Forms</h1>

    <form action="/submit" method="POST">
      <label for="first_name">First name:</label>
      <br />
      <input type="text" id="first_name" name="first_name" required />

      <label for="last_name">Last name:</label>
      <br />
      <input type="text" id="last_name" name="last_name" required />
      <br /><br />

      <label for="id_number">ID no:</label>
      <br />
      <input type="text" id="id_number" name="id_number" required />
      <br /><br />

      <label for="program">Program:</label>
      <br />
      <select name="program" id="program" required>
        <option value="" disabled selected>Choose your program/course.</option>
        <option value="subject1">SUB1: Subject 1</option>
        <option value="subject2">SUB2: Subject 2</option>
        <option value="subject3">SUB3: Subject 3</option>
      </select>
      <br /><br />

      <label for="year_level">Year Level:</label>
      <br />
      <select name="year_level" id="year_level" required>
        <option value="" disabled selected>Choose your year level.</option>
        <option value="year_one">1st year</option>
        <option value="year_two">2nd year</option>
        <option value="irregular">Irregular</option>
      </select>

      <label for="section">Section:</label>
      <br />
      <select name="section" id="section" required>
        <option value="" disabled selected>Choose your section.</option>
        <option value="section1">Section 1</option>
        <option value="section2">Section 2</option>
        <option value="section3">Section 3</option>
      </select>
      <br /><br />

      <label for="email">Email:</label>
      <br />
      <input type="email" id="email" name="email" required />
      <br /><br />

      <label for="password">Password:</label>
      <br />
      <input type="password" id="password" name="password" required />
      <br /><br />

      <button type="submit">Submit</button>
    </form>
  </body>
</html>

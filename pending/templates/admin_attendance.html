<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Logs | Admin Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/admin.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <ul class="nav-links">
                <li><a href="/admin">Dashboard</a></li>
                <li><a href="/admin/students">Manage Students</a></li>
                <li><a href="/admin/attendance" class="active">Live Logs</a></li>
                <li><a href="/admin/settings">Settings</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </aside>




        <main class="main-content">
            <header class="top-bar">
                <h1>Attendance Logs</h1>
                <span class="admin-badge">Administrator</span>
            </header>


            
            <section class="metrics-grid">
                <div class="metric-card" style="grid-column: span 3;">
                    <h3>Real-time QR Scan Feed</h3>
                    <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem;">
                        Incoming session logs and timestamps will stream here.
                    </p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>

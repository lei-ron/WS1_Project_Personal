<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings | Student Attendance Monitoring System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/admin_settings.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>Admin Portal</h2>
            </div>
            <ul class="nav-links">
                <li><a href="/admin">Dashboard</a></li>
                <li><a href="/admin/vetting">Vetting Status</a></li>
                <li><a href="/admin/students">Manage Students</a></li>
                <li><a href="/admin/attendance">Live Logs</a></li>
                <li><a href="/admin/settings" class="active">Settings</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>System Settings</h1>
                <div class="admin-profile">
                    <span>Welcome, Lei</span>
                    <div class="avatar-placeholder">Admin</div>
                </div>
            </header>

            <div class="settings-grid">
                <section class="card">
                    <div class="card-header">
                        <h3>General Attendance Rules</h3>
                    </div>
                    <form class="settings-form">
                        <div class="form-group">
                            <label for="grace-period">Late Grace Period (Minutes)</label>
                            <input type="number" id="grace-period" value="15" min="0" max="60">
                        </div>

                        <div class="form-group">
                            <label for="cutoff-time">Morning Cut-Off Time</label>
                            <input type="time" id="cutoff-time" value="09:00">
                        </div>

                        <div class="form-group">
                            <label for="auto-unbind">Allow Self-Service Hardware Unbind Requests</label>
                            <select id="auto-unbind">
                                <option value="enabled" selected>Enabled (Requires Vetting Approval)</option>
                                <option value="disabled">Disabled</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-primary">Save Changes</button>
                    </form>
                </section>





                <section class="card">
                    <div class="card-header">
                        <h3>Account Security</h3>
                    </div>
                    <form class="settings-form">
                        <div class="form-group">
                            <label for="current-pass">Current Password</label>
                            <input type="password" id="current-pass" placeholder="Enter current password">
                        </div>

                        <div class="form-group">
                            <label for="new-pass">New Password</label>
                            <input type="password" id="new-pass" placeholder="Enter new password">
                        </div>

                        <div class="form-group">
                            <label for="confirm-pass">Confirm New Password</label>
                            <input type="password" id="confirm-pass" placeholder="Confirm new password">
                        </div>

                        <button type="submit" class="btn-primary">Update Security Settings</button>
                    </form>
                </section>
            </div>
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Student Attendance Monitoring System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/overview.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <ul class="nav-links">
                <li><a href="/admin/overview" class="active">Dashboard</a></li>
                <li><a href="/admin/students">Manage Students</a></li>
                <li><a href="/admin/attendance">Live Logs</a></li>
                <li><a href="/admin/settings">Settings</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </aside>





        <main class="main-content">
            <header class="top-bar">
                <h1>System Overview</h1>
                <span class="admin-badge">Administrator</span>
            </header>



            <section class="metrics-grid">
                <div class="metric-card">
                    <h3>Total Present Today</h3>
                    <p class="metric-value">142</p>
                </div>
                <div class="metric-card">
                    <h3>Active Live Sessions</h3>
                    <p class="metric-value">4</p>
                </div>
                <div class="metric-card">
                    <h3>Pending Disputes</h3>
                    <p class="metric-value">3</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>

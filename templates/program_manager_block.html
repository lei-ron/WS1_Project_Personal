{% extends "dashboard_base.html" %} {% block title %}Academic Management{%
endblock %} {% block content %}
<form id="program_form">
  <h2>Register Program</h2>
  <label for="program_code">Program Code:</label>
  <input
    type="text"
    id="program_code"
    name="program_code"
    placeholder="e.g. BSCS"
    required
  />

  <br />

  <label for="program_name">Program Name:</label>
  <input
    type="text"
    id="program_name"
    name="program_name"
    placeholder="e.g. Computer Science"
    required
  />

  <br />

  <label for="year_levels">Number of Year Levels:</label>
  <select id="year_levels" name="year_levels" required>
    <option value="">Select Year Levels</option>
    <option value="1">1 Year</option>
    <option value="2">2 Years</option>
    <option value="3">3 Years</option>
    <option value="4">4 Years</option>
  </select>

  <br />

  <button type="submit">Register Program</button>
</form>

<br />
<hr />

<form id="section_form">
  <h2>Register Section</h2>

  <label for="program">Program:</label>
  <select id="program" name="program" required>
    <option value="">Select Program</option>
  </select>

  <br />

  <label for="learning_modality">Learning Modality:</label>
  <select id="learning_modality" name="learning_modality" required>
    <option value="">Select Modality</option>
    <option value="LF">Limited Face-to-Face</option>
    <option value="OL">Online Learning</option>
  </select>

  <br />

  <label for="campus">Campus:</label>
  <select id="campus" name="campus" required>
    <option value="">Select Campus</option>
    <option value="CA">Cainta</option>
    <option value="SA">San Mateo</option>
    <option value="CO">Cogeo</option>
    <option value="AU">Antipolo</option>
    <option value="TA">Taytay</option>
    <option value="BN">Binangonan</option>
  </select>

  <br />

  <label for="year_level">Year Level:</label>
  <select id="year_level" name="year_level" required>
    <option value="">Select Year Level</option>
  </select>

  <br />

  <label for="current_trimester">Current Trimester Period:</label>
  <select id="current_trimester" name="current_trimester" required>
    <option value="">Select Trimester</option>
    <option value="1">1st Trimester</option>
    <option value="2">2nd Trimester</option>
    <option value="3">3rd Trimester</option>
  </select>

  <br />

  <label for="trimester_period">Trimester Period:</label>
  <select id="trimester_period" name="trimester_period" required>
    <option value="">Select Trimester Period</option>
    <option value="1">1st Trimester</option>
    <option value="2">2nd Trimester</option>
    <option value="3">3rd Trimester</option>
  </select>

  <br />

  <label for="session">Session:</label>
  <select id="session" name="session" required>
    <option value="">Select Session</option>
    <option value="M">Morning</option>
    <option value="N">Noon</option>
    <option value="A">Afternoon</option>
    <option value="E">Evening</option>
  </select>

  <br />

  <label for="section_number">Section Number:</label>
  <input
    type="number"
    id="section_number"
    name="section_number"
    min="1"
    max="999"
    placeholder="e.g. 001"
    required
  />

  <br />

  <label for="section_name">Generated Section Name:</label>
  <input
    type="text"
    id="section_name"
    name="section_name"
    readonly
    placeholder="Complete the fields above"
  />

  <br />

  <button type="submit">Register Section</button>
</form>

<br />
<hr />

<h2>Add Subject</h2>

<form id="subject_form">
  <div>
    <label for="subject_code">Subject Code:</label>
    <input
      type="text"
      id="subject_code"
      name="subject_code"
      placeholder="e.g. CS101"
      required
    />
  </div>

  <div>
    <label for="subject_name">Subject Name:</label>
    <input
      type="text"
      id="subject_name"
      name="subject_name"
      placeholder="e.g. Introduction to Computing"
      required
    />
  </div>

  <div>
    <label for="schedule">Schedule:</label>
    <select id="schedule" name="schedule" required>
      <option value="" disabled selected>Select a day</option>
      <option value="Monday">Monday</option>
      <option value="Tuesday">Tuesday</option>
      <option value="Wednesday">Wednesday</option>
      <option value="Thursday">Thursday</option>
      <option value="Friday">Friday</option>
      <option value="Saturday">Saturday</option>
      <option value="Sunday">Sunday</option>
    </select>
  </div>

  <div>
    <label for="start_time">Start Time:</label>
    <input type="time" id="start_time" name="start_time" required />
  </div>

  <div>
    <label for="end_time">End Time:</label>
    <input type="time" id="end_time" name="end_time" required />
  </div>

  <div>
    <label for="building">Building:</label>
    <select id="building" name="building" required>
      <option value="" disabled selected>Select Building</option>
      <option value="B1">Building 1</option>
      <option value="B2">Building 2</option>
      <option value="B3">Building 3</option>
      <option value="B4">Building 4</option>
    </select>
  </div>

  <div>
    <label for="room_number">Room Number:</label>
    <input
      type="number"
      id="room_number"
      name="room_number"
      min="1"
      placeholder="e.g. 52"
      required
    />
  </div>

  <div>
    <label for="section">Assigned Section:</label>
    <select id="section" name="section" required>
      <option value="" disabled selected>Select Section</option>
    </select>
  </div>

  <button type="submit">Add Subject</button>
</form>

<script src="{{ url_for('static', filename='scripts/program_manager.js') }}"></script>
{% endblock %}

{% extends "dashboard_base.html" %} {% block title %}Attendance Manager{%
endblock %} {% block content %}

<h2>Attendance Manager</h2>

<label for="attendance_section">Section:</label>
<select id="attendance_section" required>
  <option value="">Select a section</option>
</select>

<br /><br />

<label for="attendance_subject">Subject:</label>
<select id="attendance_subject" required disabled>
  <option value="">Select a subject</option>
</select>

<br /><br />

<form id="attendance_form">
  <label for="student_id">Student ID:</label>
  <input
    type="text"
    id="student_id"
    name="student_id"
    placeholder="Enter student ID"
    autocomplete="off"
  />

  <br /><br />

  <label>
    <input type="checkbox" id="not_registered" />
    Not registered?
  </label>

  <br /><br />

  <div id="manual_name_container" hidden>
    <label for="manual_first_name">First Name:</label>
    <input
      type="text"
      id="manual_first_name"
      name="manual_first_name"
      placeholder="Enter first name"
      autocomplete="off"
      disabled
    />

    <br /><br />

    <label for="manual_last_name">Last Name:</label>
    <input
      type="text"
      id="manual_last_name"
      name="manual_last_name"
      placeholder="Enter last name"
      autocomplete="off"
      disabled
    />

    <br /><br />
  </div>

  <button type="submit" id="add_student_button">Add Student</button>
</form>

<p id="attendance_message"></p>

<table>
  <thead>
    <tr>
      <th>Student ID</th>
      <th>Student Name</th>
      <th>Time In</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody id="attendance_records_body">
    <tr>
      <td colspan="4">No attendance records.</td>
    </tr>
  </tbody>
</table>

<script src="{{ url_for('static', filename='scripts/attendance.js') }}"></script>

{% endblock %}
